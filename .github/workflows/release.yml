name: Release

on:
  # Each release pushes a v<version> or v<version>+<build> tag.
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read version and check for an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full_version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          version="${full_version%%+*}"
          build="${full_version#*+}"
          # Plain versions use internal package revision 1 on every platform.
          [[ $build != "$full_version" ]] || build=1
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && $build =~ ^[1-9][0-9]*$ ]] || {
            echo '::error::Invalid pubspec.yaml release version'
            exit 1
          }
          # v<version>+<build> republishes the v<version> release with a newer build.
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" && $GITHUB_REF_NAME != "v$full_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # A pushed tag always publishes, so moving a tag re-releases that version.
          if [[ $GITHUB_REF_TYPE != tag ]] && gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'new=false' >> "$GITHUB_OUTPUT"
          else
            echo 'new=true' >> "$GITHUB_OUTPUT"
          fi

  arch:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native Arch dependencies
        run: pacman -Syu --noconfirm --needed git curl jq unzip xz clang cmake ninja pkgconf gtk3 libdbusmenu-glib sqlite libglvnd libx11 xdg-utils zstd xorg-server-xvfb dbus mesa desktop-file-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Trust the checked-out repository and Flutter SDK in the container
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$FLUTTER_ROOT"
          flutter --version
      - name: Write Google sign-in client
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        shell: bash
        run: |
          test -n "$SECRET" || { echo '::error::Missing GOOGLE_CLIENT_SECRET'; exit 1; }
          printf "const googleClientId = '972544414239-80se3hktkrmo65umjut0fvpj12nvsa9k.apps.googleusercontent.com';\nconst googleClientSecret = '%s';\n" "$SECRET" > lib/data/google_client.dart
      # The release's own commit is checked again: publish needs this job,
      # so a failing test stops the release.
      - name: Analyze, test and build on Arch as an ordinary user
        shell: bash
        run: |
          useradd --create-home tester
          # A fresh repository has no restored pub cache, so tester must be able to fill it.
          export PUB_CACHE="${PUB_CACHE:-/home/tester/.pub-cache}"
          mkdir -p "$PUB_CACHE"
          chown -R tester:tester "$GITHUB_WORKSPACE" "$FLUTTER_ROOT" "$PUB_CACHE"
          runuser -u tester -- env PATH="$PATH" PUB_CACHE="$PUB_CACHE" bash -c '
            flutter pub get &&
            flutter analyze &&
            dart run tool/ci_test.dart &&
            flutter build linux --release
          '
      - name: Package the per-user Linux download
        run: bash linux/package.sh
      - name: Install and smoke test as an ordinary user
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          mkdir /tmp/eclipse-install
          tar --zstd -xf build/Eclipse.tar.zst -C /tmp/eclipse-install
          chown -R tester:tester /tmp/eclipse-install
          runuser -u tester -- bash /tmp/eclipse-install/Eclipse/install.sh
          desktop-file-validate /home/tester/.local/share/applications/dev.nicholas.productivity_app.desktop
          app=/home/tester/.local/opt/eclipse-release/current
          test "$(cat "$app/version")" = '${{ needs.version.outputs.version }}'
          test "$(cat "$app/package-release")" = '${{ needs.version.outputs.build }}'
          test ! -e "$app/lib/libsqlite3.so"
          set +e
          timeout 20s runuser -u tester -- dbus-run-session -- xvfb-run -a "$app/eclipse" > smoke.log 2>&1
          status=$?
          set -e
          cat smoke.log
          test "$status" -eq 124
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Eclipse-Linux
          if-no-files-found: error
          path: build/Eclipse.tar.zst

  desktop:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Write Google sign-in client
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$SECRET" || { echo '::error::Missing GOOGLE_CLIENT_SECRET'; exit 1; }
          printf "const googleClientId = '972544414239-80se3hktkrmo65umjut0fvpj12nvsa9k.apps.googleusercontent.com';\nconst googleClientSecret = '%s';\n" "$SECRET" > lib/data/google_client.dart
      - name: Fetch packages
        run: flutter pub get
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          flutter build macos --release --build-number='${{ needs.version.outputs.build }}'
          mkdir dmg
          cp -R build/macos/Build/Products/Release/Eclipse.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Eclipse -srcfolder dmg -ov -format UDZO build/Eclipse.dmg
      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          flutter build windows --release --build-number='${{ needs.version.outputs.build }}' 2>&1 | Tee-Object -FilePath windows-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content windows-build.log | Where-Object { $_ -match '(?i)error|failed|not found|exception' } | Select-Object -Last 15 | ForEach-Object {
              $line = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows compilation::$line"
            }
            throw 'Windows build failed'
          }
      - name: Add Windows runtime and version metadata
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            $bundle = 'build/windows/x64/runner/Release'
            Set-Content -Path "$bundle/version" -Value '${{ needs.version.outputs.version }}' -Encoding utf8NoBOM
            Set-Content -Path "$bundle/package-release" -Value '${{ needs.version.outputs.build }}' -Encoding utf8NoBOM
            $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            # Visual Studio 2026 adds a v145 directory above versioned redists.
            $crt = Get-ChildItem "$vs/VC/Redist/MSVC" -Recurse -Directory |
              Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.Parent.Name -eq 'x64' } |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $crt) { throw 'No x64 Visual C++ runtime directory found' }
            Copy-Item "$($crt.FullName)/*.dll" $bundle
          } catch {
            Write-Output "::error title=Windows runtime packaging::$($_.Exception.Message)"
            throw
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc '/DAppVersion=${{ needs.version.outputs.version }}' '/DBuildNumber=${{ needs.version.outputs.build }}' windows/installer.iss 2>&1 | Tee-Object -FilePath installer-build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content installer-build.log | Select-Object -Last 8 | ForEach-Object {
              $line = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows installer::$line"
            }
            throw 'Installer build failed'
          }
      - name: Smoke test the Windows installer and installed app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Eclipse-smoke'
          $installer = Get-Item 'build/Eclipse.exe'
          $install = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $app = Start-Process "$target/eclipse.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) { throw "App exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Eclipse-${{ runner.os }}
          if-no-files-found: error
          path: |
            build/Eclipse.dmg
            build/Eclipse.exe

  android:
    needs: version
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Write Google sign-in client
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          test -n "$SECRET" || { echo '::error::Missing GOOGLE_CLIENT_SECRET'; exit 1; }
          printf "const googleClientId = '972544414239-80se3hktkrmo65umjut0fvpj12nvsa9k.apps.googleusercontent.com';\nconst googleClientSecret = '%s';\n" "$SECRET" > lib/data/google_client.dart
      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" || { echo '::error::Missing ANDROID_KEYSTORE_BASE64 or ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > android/eclipse.keystore
          printf 'storeFile=eclipse.keystore\nstorePassword=%s\nkeyAlias=eclipse\nkeyPassword=%s\n' "$PASSWORD" "$PASSWORD" > android/key.properties
      - name: Build the APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ needs.version.outputs.build }}
        run: |
          # 26.11.4, revision 1, is 261100401: always higher for a later release.
          IFS=. read -r year month release <<< "$VERSION"
          code=$(( year * 10000000 + month * 100000 + release * 100 + BUILD ))
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --build-number "$code"
          mkdir -p build
          cp build/app/outputs/flutter-apk/app-release.apk build/Eclipse.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Eclipse-Android
          if-no-files-found: error
          path: build/Eclipse.apk

  publish:
    needs: [version, arch, desktop, android]
    # A manual run publishes too, replacing the downloads of a release that
    # already has this version (move its tag to the commit first).
    if: needs.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: Eclipse-*
          merge-multiple: true
          path: dist
      - name: Check downloads and create checksums
        run: |
          cd dist
          test -s 'Eclipse.tar.zst'
          test -s Eclipse.dmg
          test -s 'Eclipse.exe'
          test -s Eclipse.apk
          sha256sum *.tar.zst *.dmg *.exe *.apk > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Eclipse ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            <!-- eclipse-build: ${{ needs.version.outputs.build }} -->
            <!-- eclipse-linux-build: ${{ needs.version.outputs.build }} -->

            Arch Linux: extract Eclipse.tar.zst and run `bash Eclipse/install.sh` as your normal user. Missing system libraries are listed by the installer.

            Windows: run the setup .exe.

            macOS: open the .dmg and drag Eclipse to Applications.

            Android: open Eclipse.apk on your phone and allow the install.

            SHA256SUMS contains checksums for all downloads.
          files: |
            dist/*.tar.zst
            dist/Eclipse.dmg
            dist/*.exe
            dist/Eclipse.apk
            dist/SHA256SUMS
