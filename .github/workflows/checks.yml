name: Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install native Arch build dependencies
        run: pacman -Syu --noconfirm --needed git curl jq unzip xz clang cmake ninja pkgconf gtk3 libdbusmenu-glib sqlite libglvnd libx11 xdg-utils zstd
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Trust the checked-out repository and Flutter SDK in the container
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$FLUTTER_ROOT"
          flutter --version
      - name: Configure a build without Google credentials
        run: cp lib/data/google_client.example.dart lib/data/google_client.dart
      - name: Analyze, test and build as an ordinary user
        shell: bash
        run: |
          useradd --create-home tester
          # A fresh repository has no restored pub cache, so tester must be able to fill it.
          export PUB_CACHE="${PUB_CACHE:-/home/tester/.pub-cache}"
          mkdir -p "$PUB_CACHE"
          chown -R tester:tester "$GITHUB_WORKSPACE" "$FLUTTER_ROOT" "$PUB_CACHE"
          runuser -u tester -- env PATH="$PATH" PUB_CACHE="$PUB_CACHE" bash -c '
            flutter pub get &&
            flutter analyze &&
            dart run tool/ci_test.dart &&
            TZ=Australia/Adelaide dart run tool/ci_test.dart test/dates_test.dart &&
            flutter build linux --release
          '
      - name: Verify per-user packaging and installation
        run: |
          bash linux/package.sh
          mkdir /tmp/eclipse-install
          tar --zstd -xf build/Eclipse.tar.zst -C /tmp/eclipse-install
          chown -R tester:tester /tmp/eclipse-install
          runuser -u tester -- bash /tmp/eclipse-install/Eclipse/install.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true
      - name: Test the sign-in functions
        run: node --test test/web/
      - name: Build
        run: |
          cp lib/data/google_client.example.dart lib/data/google_client.dart
          flutter pub get
          bash tool/build_web.sh
